# MatCloud - Local (builds the image from this folder) with pgAdmin
#   ./scripts/redeploy.ps1              (rebuilds and starts the stack: the way to test every change)
#   docker compose -f docker-compose.local.yml up -d --build
#   App:      http://localhost:4950
#   pgAdmin:  http://localhost:4951   (no sign-in; database password: matcloud)
#   Postgres: localhost:4952          (for "dotnet run" outside Docker, see appsettings.Development.json)
name: matcloud-local

services:
  web:
    build: .
    image: matcloud:local
    restart: unless-stopped
    ports:
      - "4950:4950"
    volumes:
      - web-data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "4952:5432"
    environment:
      POSTGRES_DB: matcloud
      POSTGRES_USER: matcloud
      POSTGRES_PASSWORD: matcloud
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matcloud -d matcloud"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "4951:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@matcloud.example.com
      PGADMIN_DEFAULT_PASSWORD: matcloud
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    configs:
      - source: servers
        target: /pgadmin4/servers.json
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db

configs:
  servers:
    content: |
      {"Servers": {"1": {"Name": "MatCloud (local)", "Group": "Servers", "Host": "db", "Port": 5432, "MaintenanceDB": "matcloud", "Username": "matcloud", "SSLMode": "prefer"}}}

volumes:
  web-data:
  db-data:
  pgadmin-data:

# A fixed subnet: on a machine with many stacks Docker runs out of address pools otherwise
# ("all predefined address pools have been fully subnetted").
networks:
  default:
    ipam:
      config:
        - subnet: 10.253.51.0/24
